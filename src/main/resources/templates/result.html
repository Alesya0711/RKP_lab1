<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Студент</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; color: #333; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; display: inline-block; }
        .result-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 20px;
            max-width: 500px;
            margin-top: 20px;
        }
        .result-box p { margin: 10px 0; }
        .label { font-weight: bold; color: #555; }
        .highlight { color: #2980b9; font-weight: bold; }
        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2980b9;
            font-weight: bold;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<h1>Информация о студенте</h1>

<div class="result-box">
    <p><span class="label">ID:</span> <span th:text="${student.id}"></span></p>
    <p><span class="label">ФИО:</span> <span th:text="${student.surname} + ' ' + ${student.name} + ' ' + ${student.patronymic}"></span></p>
    <p><span class="label">E-mail:</span> <span th:text="${student.email}"></span></p>
    <p><span class="label">Год поступления:</span> <span th:text="${student.enrollmentYear}"></span></p>
    <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;"/>
    <p><span class="label">Группа:</span> <span class="highlight" th:text="${student.group}"></span></p>
    <p><span class="label">Логин для портала:</span> <span class="highlight" th:text="${student.login}"></span></p>
</div>

<a href="/form">Ввести новую информацию</a>
</body>
</html>
